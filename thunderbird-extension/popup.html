<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 14px;
      background: #F4EFE6;
      color: #111;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .box {
      background: #C8FF2E;
      border: 3px solid #111;
      box-shadow: 4px 4px 0 #111;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .title { font-weight: 900; font-size: 15px; text-transform: uppercase; }
    .sub { font-family: monospace; font-size: 11px; font-weight: 700; margin-top: 3px; }
    .card {
      background: #fff;
      border: 3px solid #111;
      box-shadow: 4px 4px 0 #111;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
    }
    .row { margin-bottom: 6px; }
    .btns { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1;
      padding: 8px;
      border: 2px solid #111;
      box-shadow: 2px 2px 0 #111;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      background: #FFE135;
    }
    button.black { background: #111; color: #C8FF2E; }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">EMPLOYMAXING BRIDGE</div>
    <div class="sub">100% LOCAL AUTO-SEND // GPLv3</div>
  </div>
  <div class="card">
    <div class="row"><strong>STATUS:</strong> <span id="st">Loading...</span></div>
    <div class="row"><strong>LAST SYNC:</strong> <span id="ts">-</span></div>
    <div class="row"><strong>SENT THIS SESSION:</strong> <span id="cnt">0</span></div>
    <div class="btns">
      <button class="black" id="btn-sync">Sync Now</button>
      <button id="btn-pause">Pause</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
